name: deploy

# Auto-deploy to Vercel production on every push. This replaces the manual
# redeploy dance. One-time setup: add a repo Actions secret VERCEL_TOKEN
# (Vercel -> Account Settings -> Tokens -> Create). The org/project IDs below
# are not secret. After that, every push here ships automatically.
#
# We deliberately do NOT run `vercel build` on the runner. That would execute
# the `vercel-build` script (drizzle migrate + next build + seed) here, where
# the database is unreachable (getaddrinfo EAI_AGAIN). Instead we hand the
# source to Vercel and let it build remotely with the project's real env vars
# (DATABASE_URL, CRON_SECRET, ...), exactly like a git-integration deploy.
on:
  push:
    branches: [claude/refactor-project-structure-JIiXS]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_SHExwgJuZWO8si3H3Nwf7xho
  VERCEL_PROJECT_ID: prj_3BEhAzYqcrFUpAjtr2Q8QdXYf4zE

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Deploy to Vercel production (remote build)
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
