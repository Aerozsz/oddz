name: deploy

# Auto-deploy to Vercel production on every push. This replaces the manual
# redeploy dance. One-time setup: add a repo Actions secret VERCEL_TOKEN
# (Vercel → Account Settings → Tokens → Create). The org/project IDs below
# are not secret. After that, every push here ships automatically.
on:
  push:
    branches: [claude/refactor-project-structure-JIiXS]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_SHExwgJuZWO8si3H3Nwf7xho
  VERCEL_PROJECT_ID: prj_3BEhAzYqcrFUpAjtr2Q8QdXYf4zE

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull Vercel project settings + env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build (migrate + next build + seed, via vercel.json buildCommand)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
