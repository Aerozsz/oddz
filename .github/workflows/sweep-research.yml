name: sweep research

# The replay engine, hosted here instead of on a laptop.
#
# Three constraints shaped this, and the shape is not the obvious one.
#
# The operator's machine cannot stay on. The cloud session that writes this code
# cannot reach Binance at all — its network policy answers both hosts with
# "request blocked: no rule or allowlist entry allows host". And a probe run
# settled the third: a GitHub runner egresses from a US address, so
# `fapi.binance.com` returns 451 (unavailable for legal reasons) while
# `data.binance.vision` returns 200 on both its index and a real zip.
#
# So a runner cannot hold a live feed, and there is no point pretending
# otherwise — that is why the first version of this file, which tried to run the
# live shadow collector, failed in one second at the symbol gate. What a runner
# can do is the archive work, which happens to be the highest-value work in the
# project: the feature search over hundreds of thousands of samples is what
# produces verdicts, and it needs no socket, no credentials and no account.
#
# It is also the part that has been silently broken. The replay refused every
# pass with "RangeError: Maximum call stack size exceeded" — a spread of every
# close in the window into Math.min — so FINDINGS stopped regenerating on
# 2026-08-25 while the loop still looked like it was running. That is fixed, and
# hosting it here means it runs whether or not a laptop is on.

on:
  schedule:
    - cron: "17 */6 * * *"

  # A trigger file, because the integration token that writes this repository is
  # not granted `actions: write` and cannot dispatch a run through the API.
  # Scoped to paths the job never writes, so a job that commits to `evidence/`
  # cannot restart itself.
  push:
    branches: [claude/amm-liquidity-sweep-8qhnd0]
    paths:
      - "control/RUN_RESEARCH"
      - ".github/workflows/sweep-research.yml"

  workflow_dispatch:
    inputs:
      symbols:
        description: "Contracts to replay, comma separated"
        required: false
        default: ""
      days:
        description: "Days of history to pull"
        required: false
        default: "30"

concurrency:
  group: sweep-research
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      SWEEP_SYMBOLS: ${{ github.event.inputs.symbols || vars.SWEEP_SYMBOLS || 'LITUSDT,BTCUSDT' }}
      DAYS: ${{ github.event.inputs.days || '30' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/amm-liquidity-sweep-8qhnd0
          # A shallow clone cannot rebase onto the operator's pushes, and this
          # branch takes commits from two places at once.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Confirm the contract exists, using the archive
        run: |
          # The usual check calls fapi/exchangeInfo, which is 451 from a US
          # runner. The archive answers the same question from a host that can
          # reach it — but by *fetching a file*, not by reading a listing.
          #
          # Two listing methods were tried first and both gave wrong answers: the
          # delimiter listing is capped at 1000 alphabetical keys, and the
          # per-symbol prefix query reported BTCUSDT absent. A control in the set
          # is what caught the second, and this gate carries one for the same
          # reason — if BTCUSDT reads absent the method is broken and every other
          # verdict here is worthless.
          #
          # Guessing a ticker is a silent failure: the run finds no data and
          # looks quiet rather than wrong. Hard gate.
          dates=""
          for d in 2 3 4 5 6 7 8; do dates="$dates $(date -u -d "-$d day" +%F)"; done

          present () {
            for day in $dates; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
                "https://data.binance.vision/data/futures/um/daily/klines/$1/1m/$1-1m-${day}.zip" || echo 000)
              [ "$code" = "200" ] && return 0
            done
            return 1
          }

          if ! present BTCUSDT; then
            echo "control BTCUSDT reads absent — the archive or this check is broken, not the symbol"
            exit 1
          fi
          echo "control BTCUSDT: present"

          fail=0
          for sym in ${SWEEP_SYMBOLS//,/ }; do
            if present "$sym"; then
              echo "$sym: present in the USD-M archive"
            else
              echo "$sym: NOT FOUND in the USD-M archive on any of$dates"
              echo "  Either it is not a USD-M perpetual, or it is too new to have published a daily file."
              fail=1
            fi
          done
          exit $fail

      - name: Pull history and replay
        run: |
          set -uo pipefail
          for sym in ${SWEEP_SYMBOLS//,/ }; do
            echo "::group::history $sym"
            npm run sweep:history -- --symbol "$sym" --days "$DAYS" || true
            echo "::endgroup::"
            echo "::group::spread $sym"
            # The cost bar decides which findings are real, and on LITUSDT it
            # rested on one estimator because Roll returned null at minute
            # resolution. Ticks carry the trade-direction flag, so the spread is
            # observed at direction flips rather than inferred from the price
            # path — which is the failure mode Roll has and this does not.
            # Three days is plenty for a median over hundreds of thousands of
            # flips, and avoids pulling a gigabyte of tape for a single number.
            npm run sweep:spread -- --symbol "$sym" --days 3 || true
            echo "::endgroup::"
            echo "::group::impact $sym"
            # The spread turned out to be one tick on both contracts, which
            # cannot threaten a 16bp finding. What can is that the finding is a
            # decile of a thin book: the binding cost is walking it, not
            # crossing it. bookDepth is already downloaded by the history step
            # and its non-1% bands were being discarded — they are a depth
            # curve, which is exactly what pricing an order against needs.
            npm run sweep:impact -- --symbol "$sym" || true
            echo "::endgroup::"
            echo "::group::realized $sym"
            # The modelled curve prices resting depth, and resting is not
            # available — quotes are pulled as an order arrives. This reads the
            # same cost off orders that were actually executed: consecutive
            # one-sided prints are one order walking the book, so the notional
            # it lifted and the distance it travelled are both on the tape. It
            # runs high where the modelled curve runs low, and the pair bracket
            # what a real order pays. Same three days as the spread step, since
            # it reads the same files.
            npm run sweep:realized -- --symbol "$sym" --days 3 || true
            echo "::endgroup::"
            echo "::group::backtest $sym"
            # Not `|| true`: a replay that refuses is the failure this workflow
            # exists to surface, and it spent six days refusing silently.
            # --symbol explicitly: the worker takes it from argv, and relying on
            # an env var it does not read is how the last run replayed BTCUSDT
            # after downloading LITUSDT.
            timeout 60m npm run sweep:backtest -- --symbol "$sym"
            echo "::endgroup::"
          done

      - name: Publish the findings
        if: always()
        run: |
          set -uo pipefail
          git config user.name "sweep-research[bot]"
          git config user.email "noreply@anthropic.com"

          {
            echo "## $(date -u +%FT%TZ) — archive replay"
            echo "symbols: ${SWEEP_SYMBOLS} · days: ${DAYS} · run ${GITHUB_RUN_ID}"
          } >> evidence/RUNNER.md

          # Pathspec only, never `git add -A`: a credentials file sits in the
          # operator's working tree and this branch is shared with it.
          #
          # What this used to do was `git commit` then `git pull --rebase`, four
          # times with a backoff. It published nothing on 2026-09-20 and reported
          # success, which is the failure mode this whole workflow exists to
          # surface. Three separate things were wrong:
          #
          #  - rebasing *generated* files is meaningless. The operator's machine
          #    pushes state snapshots that touch the same paths, and git has no
          #    way to merge two machines' versions of a computed report. The
          #    run that just recomputed them from the archive is authoritative
          #    and does not need anyone's permission.
          #  - the first conflict wedged the working tree, so attempts two
          #    through four failed on "unmerged files" rather than on the race
          #    they were written to survive. The retry loop was decorative.
          #  - `sleep` exits 0, so a loop that never pushed still left the step
          #    green. Forty seconds of failure looked like a successful publish.
          #
          # So: take only the paths this run actually changed, reset hard onto
          # origin's tip, put those paths back, and push. Starting from origin
          # every attempt means there is nothing to conflict with. Carrying only
          # the changed paths means the operator's own evidence files — the
          # snapshot its live agent writes — survive untouched rather than being
          # reverted to whatever this checkout happened to hold.
          changed=$(git status --porcelain -- evidence/ | awk '{print $NF}')
          if [ -z "$changed" ]; then
            echo "no evidence changed — nothing to publish"
            exit 0
          fi
          echo "publishing: $changed"

          keep=$(mktemp -d)
          for f in $changed; do
            mkdir -p "$keep/$(dirname "$f")"
            cp "$f" "$keep/$f"
          done

          published=0
          for i in 1 2 3 4; do
            git fetch -q origin claude/amm-liquidity-sweep-8qhnd0 || { sleep $(( i * 4 )); continue; }
            git reset -q --hard FETCH_HEAD
            for f in $changed; do
              mkdir -p "$(dirname "$f")"
              cp "$keep/$f" "$f"
            done
            git add -- $changed
            if git diff --cached --quiet; then
              echo "origin already holds this run's output"
              published=1
              break
            fi
            git commit -q -m "research: archive replay (${SWEEP_SYMBOLS}, ${DAYS}d)"
            if git push -q origin HEAD:claude/amm-liquidity-sweep-8qhnd0; then
              published=1
              break
            fi
            sleep $(( i * 4 ))
          done

          # A publish that fails is the loop going dark with nobody watching.
          # It gets to say so.
          if [ "$published" != "1" ]; then
            echo "::error::the replay ran but its findings were never pushed — four attempts"
            exit 1
          fi
