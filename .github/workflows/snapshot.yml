name: snapshot

# Every-5-minute market snapshot. Vercel Hobby caps cron at once/day, so
# the frequent ingest runs here on GitHub's scheduler instead. Add a repo
# Actions secret CRON_SECRET (Settings -> Secrets and variables -> Actions)
# matching the Vercel CRON_SECRET env var.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger snapshot ingest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Send the secret in the Authorization header, NOT the URL, so it
          # never lands in access logs / Referer. Passed via env + --header
          # from a variable so it isn't rendered into the process list.
          curl -fsS --max-time 180 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://oddz-aeriaszs-projects.vercel.app/api/cron/snapshot" \
            -o /dev/null -w "snapshot status: %{http_code}\n"
