name: Build Android APK

on:
  push:
    branches: ["claude/youtube-mp3-downloader-nv160f"]
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: Show APK info
        run: ls -lh android/app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: YT-DL-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  download-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YT-DL-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Real YouTube download in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: |
            adb install app-debug.apk
            adb shell am start -n dev.aero.ytmp3/.MainActivity -e test_url "https://www.youtube.com/watch?v=jNQXAC9IVRw"
            for i in $(seq 1 48); do
              sleep 10
              if adb shell "ls /sdcard/Download/yt-mp3/*.mp3" 2>/dev/null | grep -q '\.mp3'; then
                echo "DOWNLOAD TEST PASSED — MP3 produced:"
                adb shell ls -la /sdcard/Download/yt-mp3/
                exit 0
              fi
            done
            echo "DOWNLOAD TEST FAILED — app state follows"
            adb shell uiautomator dump /sdcard/ui.xml
            adb shell cat /sdcard/ui.xml | grep -o 'text="[^"]*"' | tail -50
            adb shell ls -la /sdcard/Download/yt-mp3/ || true
            adb logcat -d | grep -iE "ytmp3|youtubedl|python" | tail -60
            exit 1
