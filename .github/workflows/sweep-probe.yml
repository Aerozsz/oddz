name: sweep probe

# Which Binance hosts a runner can actually reach.
#
# The research workflow's symbol gate failed with HTTP 451 — "unavailable for
# legal reasons" — which is Binance geo-blocking GitHub's US runner IPs. That
# kills the live feed here, but it does not automatically kill the archive:
# data.binance.vision is a static CDN for historical files and is not obviously
# under the same restriction. The whole hosting decision turns on that, so it is
# worth thirty seconds to find out rather than assuming either way.
#
# Prints and never fails, because the answer is the point.

on:
  push:
    branches: [claude/amm-liquidity-sweep-8qhnd0]
    paths:
      - "control/RUN_PROBE"
      - ".github/workflows/sweep-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reachability
        run: |
          probe () {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$2" || echo "000")
            echo "$1 -> HTTP $code   ($2)"
          }
          echo "runner egress IP: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          echo "geo: $(curl -s --max-time 10 https://ipinfo.io/country || echo unknown)"
          echo
          probe "live REST (fapi)      " "https://fapi.binance.com/fapi/v1/time"
          probe "live REST exchangeInfo" "https://fapi.binance.com/fapi/v1/exchangeInfo"
          probe "archive daily index   " "https://data.binance.vision/?prefix=data/futures/um/daily/klines/BTCUSDT/1m/"
          probe "archive a real zip    " "https://data.binance.vision/data/futures/um/daily/klines/BTCUSDT/1m/BTCUSDT-1m-2026-08-25.zip"
          probe "binance.com www       " "https://www.binance.com/en"
          echo
          echo "A 451 is geo-blocking. A 404 on the zip only means that date is not published."

      - name: Test specific symbols directly, with a control
        env:
          CANDIDATES: ${{ vars.SYMBOL_CANDIDATES || 'LITUSDC LITUSDT BTCUSDC BTCUSDT' }}
        run: |
          # NOT a bucket listing. The delimiter listing returns CommonPrefixes
          # capped at 1000 keys in alphabetical order, so anything past the
          # early letters comes back empty whether or not it exists — the first
          # attempt at this reported no LIT contracts in USD-M, COIN-M *and*
          # spot, which is not credible and was the cap, not the answer.
          #
          # A prefix query scoped to one symbol has no such cap. BTCUSDT and
          # BTCUSDC are included as controls: if they come back absent then the
          # method is broken, and no conclusion about anything else is safe.
          probe_symbol () {
            market="$1"; sym="$2"
            body=$(curl -s --max-time 40 \
              "https://data.binance.vision/?prefix=data/futures/${market}/daily/klines/${sym}/1m/&max-keys=3" || true)
            n=$(echo "$body" | grep -c "${sym}-1m-" || true)
            if [ "$n" -gt 0 ]; then
              latest=$(echo "$body" | tr '<' '\n' | grep -o "${sym}-1m-[0-9-]*\.zip" | tail -1)
              echo "  ${market}/${sym}: PRESENT (e.g. ${latest})"
            else
              echo "  ${market}/${sym}: absent"
            fi
          }
          for sym in $CANDIDATES; do
            echo "$sym"
            probe_symbol um "$sym"
            probe_symbol cm "$sym"
          done
          echo
          echo "If a BTC control reads absent, the method is wrong and nothing else here counts."
